<div class="relative flex h-screen min-h-150 overflow-hidden bg-[#101310] font-sans"
     [class.sidebar-open]="sidebarOpen()">

  @if (sidebarOpen()) {
    <div class="fixed inset-0 z-40 bg-black/45 md:hidden" (click)="toggleSidebar()"></div>
  }

  <aside class="z-50 flex w-18 shrink-0 flex-col items-center bg-[#1D241E] py-5 pb-6
                max-md:fixed max-md:top-0 max-md:left-0 max-md:h-full max-md:w-50
                max-md:items-start max-md:-translate-x-full max-md:transition-transform max-md:duration-200"
         [class.max-md:translate-x-0]="sidebarOpen()">

    <div class="mb-8 max-md:px-6">
      <div class="flex h-10 w-10 items-center justify-center rounded-[10px] bg-[#C7F36B] text-[#101310]">
        <span class="font-[Syne] text-sm font-extrabold tracking-tight">KO</span>
      </div>
    </div>

    <nav class="flex w-full flex-1 flex-col items-center gap-1 max-md:items-start">
      @for (item of navItems; track item.path) {
        <a [routerLink]="item.path"
          routerLinkActive="text-[#F4F3ED] cd-nav-active"
          [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          class="relative flex w-full flex-col items-center justify-center gap-[0.3rem] py-3 text-white/40 no-underline transition-colors hover:text-white/75
                 max-md:flex-row max-md:justify-start max-md:gap-3 max-md:px-6">

          @if (item.icon === 'grid') {
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
          }
          @if (item.icon === 'book-open') {
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18"/><path d="M3 12h18"/><path d="M3 17h12"/></svg>
          }
          @if (item.icon === 'calendar') {
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          }
          @if (item.icon === 'layers') {
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
          }
          @if (item.icon === 'settings') {
            <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          }

          <span class="text-[0.6rem] font-medium tracking-[0.2px] max-md:text-[0.85rem]">{{ item.label }}</span>
        </a>
      }
    </nav>

    <button type="button"
      class="flex w-full cursor-pointer flex-col items-center justify-center gap-[0.3rem] border-0 bg-transparent py-3 text-white/35 no-underline transition-colors hover:text-white/65
             max-md:flex-row max-md:justify-start max-md:gap-3 max-md:px-6"
      (click)="store.resetDemo()">
      <svg class="shrink-0" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 12 11 12"/></svg>
      <span class="text-[0.6rem] font-medium max-md:text-[0.85rem]">Reset</span>
    </button>
  </aside>

  <main class="relative flex flex-1 flex-col overflow-hidden max-md:flex-col">
    <button class="z-45 fixed top-4 left-4 hidden h-9.5 w-9.5 cursor-pointer items-center justify-center rounded-lg border-none bg-[#1D241E] text-white max-md:flex"
            (click)="toggleSidebar()" aria-label="Ouvrir le menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <header class="flex items-center justify-between gap-4 border-b border-white/6 px-6 py-4 max-md:pt-16">
      <div>
        <p class="font-[Syne] text-lg font-extrabold tracking-tight text-[#F4F3ED]">KORI</p>
        <p class="text-xs text-[#9AA396]">Your money, in control.</p>
      </div>
      <app-account-menu (selected)="onMenu($event)" (share)="onShare()" />
    </header>

    <div class="kori-scroll flex-1 overflow-y-auto">
      <router-outlet />
    </div>
  </main>
</div>

<ui-confirmation-toast />
<app-cookie-consent-3 />
