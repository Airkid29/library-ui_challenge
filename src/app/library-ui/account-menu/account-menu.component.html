<div class="relative inline-flex items-center gap-2">
  @if (trigger() === 'button') {
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-full border border-ecosave-line bg-ecosave-surface px-4 py-2 text-sm font-semibold text-ecosave-text shadow-sm transition-colors duration-150 hover:bg-ecosave-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ecosave-accent"
      aria-haspopup="menu"
      [attr.aria-expanded]="isOpen()"
      (click)="toggleMenu()"
    >
      {{ buttonLabel() }}
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M6 9l6 6 6-6" />
      </svg>
    </button>
  } @else {
    <button
      type="button"
      class="inline-flex items-center gap-1.5 rounded-full border border-ecosave-line bg-ecosave-surface px-4 py-2 text-sm font-semibold text-ecosave-text shadow-sm transition-colors duration-150 hover:bg-ecosave-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ecosave-accent"
      (click)="onShare()"
    >
      Exporter
      <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14" />
      </svg>
    </button>

    <button
      type="button"
      class="h-10 w-10 shrink-0 overflow-hidden rounded-full ring-2 ring-ecosave-bg transition-shadow duration-150 hover:ring-ecosave-accent focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ecosave-accent"
      aria-label="Ouvrir le menu du compte"
      aria-haspopup="menu"
      [attr.aria-expanded]="isOpen()"
      (click)="toggleMenu()"
    >
      <img [src]="avatarUrl()" alt="" loading="lazy" class="h-full w-full object-cover" />
    </button>
  }

  @if (isOpen()) {
    <div
      class="absolute right-0 top-full z-20 mt-3 w-64 overflow-hidden rounded-2xl bg-ecosave-surface p-2 shadow-xl ring-1 ring-white/10"
      role="menu"
    >
      @for (item of items(); track item.id) {
        @if (item.dividerBefore) {
          <div class="my-2 border-t border-ecosave-line"></div>
        }

        <button
          type="button"
          role="menuitem"
          class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm transition-colors duration-100 hover:bg-ecosave-hover {{
            activeId() === item.id ? 'bg-ecosave-chip font-semibold text-ecosave-text' : 'text-ecosave-muted'
          }}"
          (click)="selectItem(item)"
        >
          <span class="flex h-5 w-5 shrink-0 items-center justify-center text-ecosave-muted" aria-hidden="true">
            @switch (item.icon) {
              @case ('profile') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="8" r="3.5" />
                  <path d="M5 20c1.2-3.6 4-5.5 7-5.5s5.8 1.9 7 5.5" />
                </svg>
              }
              @case ('community') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M8 12a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" />
                  <path d="M3 19c.7-2.6 2.5-4 5-4s4.3 1.4 5 4" />
                  <path d="M14.5 8.5a2.5 2.5 0 1 0 0-5" />
                  <path d="M16 15.2c1.9.3 3.2 1.5 3.7 3.8" />
                </svg>
              }
              @case ('subscription') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2.5" y="5.5" width="19" height="13" rx="2.5" />
                  <path d="M2.5 10h19" />
                </svg>
              }
              @case ('settings') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="8" cy="8" r="3.25" />
                  <circle cx="16" cy="16" r="3.25" />
                  <path d="M8 11.25V17M16 7v6.75" />
                </svg>
              }
              @case ('help') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="8.5" />
                  <path d="M12 11v5" />
                  <path d="M12 8v.01" />
                </svg>
              }
              @case ('sign-out') {
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 7V5.5A1.5 1.5 0 0 0 12.5 4h-6A1.5 1.5 0 0 0 5 5.5v13A1.5 1.5 0 0 0 6.5 20h6a1.5 1.5 0 0 0 1.5-1.5V17" />
                  <path d="M10 12h10m0 0-3-3m3 3-3 3" />
                </svg>
              }
            }
          </span>

          <span class="flex-1 truncate">{{ item.label }}</span>

          @if (item.badge) {
            <span class="inline-flex shrink-0 items-center gap-1 rounded-full bg-ecosave-accent/15 px-2 py-0.5 text-[11px] font-bold text-ecosave-positive">
              <svg class="h-2.5 w-2.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M13 2 3 14h6l-1 8 11-14h-7l1-6Z" />
              </svg>
              {{ item.badge }}
            </span>
          }
        </button>
      }
    </div>
  }
</div>
