@if (store.confirm(); as request) {
  <div class="fixed inset-0 z-70 flex items-end justify-center bg-black/50 p-4 sm:items-center">
    <div class="w-full max-w-md rounded-2xl border border-white/10 bg-[#1D241E] p-5 font-sans shadow-2xl">
      <h2 class="mb-2 text-lg font-semibold text-[#F4F3ED]">{{ request.title }}</h2>
      <p class="mb-5 text-sm leading-relaxed text-[#9AA396]">{{ request.message }}</p>
      <div class="flex justify-end gap-3">
        <button
          type="button"
          class="cursor-pointer rounded-lg border border-white/15 bg-transparent px-4 py-2 text-sm font-semibold text-[#F4F3ED] transition-colors hover:bg-white/5"
          (click)="store.resolveConfirm(false)"
        >
          {{ request.cancelLabel || 'Annuler' }}
        </button>
        <button
          type="button"
          class="cursor-pointer rounded-lg border-none px-4 py-2 text-sm font-semibold transition-colors"
          [class.bg-red-500]="request.tone === 'danger'"
          [class.text-white]="request.tone === 'danger'"
          [class.bg-[#C7F36B]]="request.tone !== 'danger'"
          [class.text-[#101310]]="request.tone !== 'danger'"
          (click)="store.resolveConfirm(true)"
        >
          {{ request.confirmLabel || 'Confirmer' }}
        </button>
      </div>
    </div>
  </div>
}

@if (store.toast(); as toast) {
  <div class="pointer-events-none fixed right-4 bottom-4 z-80 max-w-225 p-0 font-sans">
    <div class="pointer-events-auto flex max-w-100 items-center gap-3 rounded-xl bg-gray-800 px-5 py-4">
      <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-white/10 text-white">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
          <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
          <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
        </svg>
      </div>
      <div class="flex-1">
        <span class="text-sm text-white">{{ toast.message }}</span>
        <div class="ct-progress relative mt-2 h-0.75 overflow-hidden rounded-full bg-white/20"></div>
      </div>
      @if (toast.undoLabel) {
        <button
          class="cursor-pointer rounded-md border border-white/30 bg-transparent px-4 py-2 text-xs font-semibold text-white transition-colors hover:bg-white/10"
          (click)="store.consumeUndo()"
        >
          {{ toast.undoLabel }}
        </button>
      }
    </div>
  </div>
}
