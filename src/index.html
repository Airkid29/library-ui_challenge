<!doctype html>
<html lang="fr">
  <head>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('ecosave.theme');
          if (theme === null) {
            theme = localStorage.getItem('kori.theme');
            if (theme !== null) {
              localStorage.setItem('ecosave.theme', theme);
              localStorage.removeItem('kori.theme');
            }
          }
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <meta charset="utf-8" />
    <title>Eco-save — Your money, in control.</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Eco-save, application de gestion financière personnelle." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
